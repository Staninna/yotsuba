// Classes the Compose compiler should treat as stable even though it cannot prove it
// across module boundaries or through read-only collection interfaces.
//
// Everything under domain.model is immutable by construction: data classes and sealed
// hierarchies holding vals and read-only List/Map/Set, or plain classes whose only state
// is private vals computed once in the constructor (PostGraph, FilterMatcher). Nothing in
// the package holds a var or a Mutable* collection as a property. Keep it that way, or
// take the offending class off this list.
dev.stan.yotsuba.domain.model.*
